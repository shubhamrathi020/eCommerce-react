<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>You are offline</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; font-family: system-ui, sans-serif; background: #ffffff; color: #111827; }
      main { max-width: 28rem; text-align: center; }
      h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
      p { margin: .5rem 0; color: #4b5563; }
      a, button { display: inline-block; min-height: 44px; margin-top: 1rem; padding: .6rem 1.1rem; border: 0; border-radius: 10px; background: #4f46e5; color: #fff; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #0b1020; color: #f9fafb; } p { color: #d1d5db; } a, button { background: #a5b4fc; color: #0b1020; } }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>We could not reach the shop. Pages you have already looked at may still open from your device.</p>
      <p>Your cart, checkout and orders always need a connection so you never see an old price.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="/">Go to the home page</a>
    </main>
  </body>
</html>
