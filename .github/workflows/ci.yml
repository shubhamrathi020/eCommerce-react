name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # the "Run workflow" button on the Actions tab

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  images:
    name: Build the production images
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    strategy:
      matrix:
        app: [storefront, admin, seller]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg APP=${{ matrix.app }} -t shop-react-${{ matrix.app }}:ci .
      # The image must start read-only and answer its health check.
      - run: |
          docker run -d --name app --read-only --tmpfs /tmp --tmpfs /var/cache/nginx --tmpfs /etc/nginx/conf.d:uid=101,gid=101,mode=755 -p 8080:8080 shop-react-${{ matrix.app }}:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break || sleep 1; done
          curl -fs -o /dev/null -w '%{http_code}\n' http://localhost:8080/some/deep/link
